# ari 导览站 —— tour.snowmeet.top
# 纯静态站点，根目录就是仓库里的 web_api/tour，不经过 FastAPI。
# 更新 = cd /home/ubuntu/ari && git pull --ff-only，不用重启任何服务。
# 浏览器的 Geolocation API 只在安全上下文可用，因此 HTTP 一律跳转 HTTPS。

server {
    listen 80;
    listen [::]:80;
    server_name tour.snowmeet.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tour.snowmeet.top;

    # TrustAsia 手动签发，2027-01-07 到期，没有自动续期
    ssl_certificate     /etc/ssl/tour/tour.snowmeet.top.crt;
    ssl_certificate_key /etc/ssl/tour/tour.snowmeet.top.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/ari-tour-content.conf;
}
