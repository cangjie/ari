# ari tour alias: HTTP-01 validation and HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name tour.arimuseum.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tour.arimuseum.org;

    ssl_certificate     /etc/letsencrypt/live/tour.arimuseum.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tour.arimuseum.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/ari-tour-content.conf;
}
